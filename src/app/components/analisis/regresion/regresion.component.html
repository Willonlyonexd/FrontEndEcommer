<div class="card">
  <div class="card-header">
    <h3>Predicción de Ventas</h3>
    <div class="btn-group" role="group">
      <button class="btn btn-outline-primary" (click)="cambiarDias(7)">7 días</button>
      <button class="btn btn-outline-primary" (click)="cambiarDias(15)">15 días</button>
      <button class="btn btn-outline-primary" (click)="cambiarDias(29)">30 días</button>
    </div>
  </div>
  <div class="card-body">
    <div style="height: 400px;">
      <canvas #chartCanvas></canvas>
    </div>
  </div>
</div>
